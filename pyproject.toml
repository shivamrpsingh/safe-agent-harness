[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "safe-agent-harness"
version = "0.2.0"
description = "A safe, secure, observable harness for LLM agents: risk-tiered tools, approvals, sandboxing, limits, guards, tracing, and evals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shivam" }]
keywords = ["llm", "agents", "ai-safety", "tool-calling", "guardrails", "claude", "mcp", "prompt-injection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
ollama = ["ollama>=0.4"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/shivamrpsingh/safe-agent-harness"
Issues = "https://github.com/shivamrpsingh/safe-agent-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
safe-agent-harness = "safe_agent_harness.cli:main"

[tool.hatch.build.targets.wheel.force-include]
"skills/safe-agent-harness" = "safe_agent_harness/_bundle/skill"
"commands" = "safe_agent_harness/_bundle/commands"
"adapters" = "safe_agent_harness/_bundle/adapters"
